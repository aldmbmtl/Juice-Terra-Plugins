{{- if eq .Values.credentials.existingSecretName "" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "juice-agent.fullname" . }}
data:
  {{ .Values.credentials.tokenKey }}: {{ .Values.credentials.token | b64enc }}
  {{ .Values.credentials.poolKey }}: {{ .Values.credentials.pool | b64enc }}
{{- end }}